name: Monitoring

# Checks the Prometheus rules, the Alertmanager config and the Grafana
# dashboards against a live stack: qsrv (built from this commit) with load,
# Prometheus, Alertmanager and Grafana provisioned from deploy/. Every panel
# query runs through Grafana; screenshots of the dashboards are uploaded.

on:
  pull_request:
    paths:
      - "deploy/prometheus/**"
      - "deploy/grafana/**"
      - "deploy/monitoring/**"
      - "internal/obs/**"
      - "Dockerfile"
      - ".github/ci/monitoring/**"
      - ".github/workflows/monitoring.yml"
  push:
    branches: [main]
    paths:
      - "deploy/prometheus/**"
      - "deploy/grafana/**"
      - "deploy/monitoring/**"
      - "internal/obs/**"
      - "Dockerfile"
      - ".github/ci/monitoring/**"
      - ".github/workflows/monitoring.yml"

permissions:
  contents: read

concurrency:
  group: monitoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS: prom/prometheus:v3.15.0
  ALERTMANAGER: prom/alertmanager:v0.30.1

jobs:
  stack:
    name: Rules and dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dashboards match generate.py
        run: |
          mkdir -p "$RUNNER_TEMP/gen"
          python3 deploy/grafana/generate.py "$RUNNER_TEMP/gen" >/dev/null
          diff -r "$RUNNER_TEMP/gen" deploy/grafana/dashboards \
            || { echo "::error::deploy/grafana/dashboards is out of date: run python3 deploy/grafana/generate.py deploy/grafana/dashboards"; exit 1; }

      - name: promtool and amtool
        run: |
          docker run --rm -v "$PWD/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            --entrypoint promtool "$PROMETHEUS" check rules /etc/prometheus/alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            -v "$PWD/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            --entrypoint promtool "$PROMETHEUS" check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint amtool "$ALERTMANAGER" check-config /etc/alertmanager/alertmanager.yml

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Start the stack
        env:
          QSRV_IMAGE: qsrv:ci
        run: |
          docker build -q -t qsrv:ci .
          go build -o "$RUNNER_TEMP/bin/" ./cmd/qctl
          key=$(openssl rand -hex 32)
          echo "QSRV_API_KEY=$key" >> "$GITHUB_ENV"
          printf 'QSRV_API_KEYS=ci:load:%s\nQSRV_BACKUP_EVERY=10s\n' "$key" > deploy/monitoring/.env
          docker compose -f deploy/monitoring/docker-compose.yml up -d --quiet-pull
          for _ in $(seq 60); do curl -sf localhost:8080/healthz >/dev/null && curl -sf localhost:3000/api/health >/dev/null && break; sleep 2; done
          curl -sf localhost:8080/healthz && curl -sf localhost:3000/api/health

      - name: Load
        env:
          QSRV_ADDR: http://localhost:8080
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          .github/ci/monitoring/load.sh setup
          # Prometheus must see the new queues' counters at 0 before the events.
          until curl -sf 'localhost:9090/api/v1/query?query=qsrv_messages_total{queue="ci/orders",event="dead_lettered"}' | grep -q '"value"'; do sleep 2; done
          .github/ci/monitoring/load.sh traffic

      - name: Alerts fire
        run: |
          # QsrvDeadLetters has no 'for': it fires on the first evaluation that
          # sees the dead letters. This checks counters, rules and Prometheus end to end.
          for _ in $(seq 45); do
            curl -sf 'localhost:9090/api/v1/alerts' | grep -q '"alertname":"QsrvDeadLetters".*"state":"firing"' && break
            sleep 2
          done
          curl -sf 'localhost:9090/api/v1/alerts' | grep -q '"alertname":"QsrvDeadLetters".*"state":"firing"' \
            || { echo "::error::QsrvDeadLetters did not fire"; curl -s localhost:9090/api/v1/alerts; exit 1; }
          echo "rules loaded: $(curl -sf localhost:9090/api/v1/rules | grep -o '"name":"Qsrv[A-Za-z]*"' | sort -u | wc -l) alerts"
          # One more scrape for the panels (and the snapshot metrics, every 10s).
          sleep 20

      - name: Every panel query through Grafana
        run: python3 .github/ci/monitoring/check_dashboards.py http://localhost:3000 deploy/grafana/dashboards/*.json

      - name: Screenshots
        if: always()
        run: |
          mkdir -p shots
          npm install --no-save --silent playwright@1.64.1
          npx playwright install --with-deps chromium >/dev/null
          node .github/ci/monitoring/screenshots.js http://localhost:3000 shots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grafana-dashboards
          path: shots/

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/monitoring/docker-compose.yml logs --tail=80
