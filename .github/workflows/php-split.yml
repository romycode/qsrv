name: PHP split

# Publishes php/ to the read-only mirror romycode/qsrv-php, which Packagist
# reads. The PHP package is versioned independently of the Go server:
#
#   git tag v0.4.0       -> Go server/module release (this repo)
#   git tag php/v0.2.0   -> PHP package v0.2.0 (tag v0.2.0 on the mirror)
#
# Setup (once): create the empty repo romycode/qsrv-php, add a deploy key with
# write access to it, and store the private key in this repo as the secret
# QSRV_PHP_DEPLOY_KEY.

on:
  push:
    branches: [main]
    paths: ["php/**", ".github/workflows/php-split.yml"]
    tags: ["php/v*"]
  workflow_dispatch:

concurrency:
  group: php-split
  cancel-in-progress: false

permissions:
  contents: read

env:
  MIRROR: git@github.com:romycode/qsrv-php.git

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the split rewrites php/ history; it needs all of it

      - name: SSH deploy key
        id: key
        env:
          KEY: ${{ secrets.QSRV_PHP_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::QSRV_PHP_DEPLOY_KEY is not set: nothing published (see the setup notes in this workflow)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Split php/
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "qsrv split"
          git config user.email "noreply@github.com"
          # Deterministic: the same php/ history always yields the same commits,
          # so each run fast-forwards the mirror.
          sha=$(git subtree split --prefix=php HEAD)
          echo "split commit: $sha"
          echo "SPLIT_SHA=$sha" >> "$GITHUB_ENV"

      - name: Publish main
        if: steps.key.outputs.ok == 'true' && github.ref_type == 'branch'
        run: |
          # No --force: if this is rejected, someone pushed to the mirror directly.
          git push "$MIRROR" "$SPLIT_SHA:refs/heads/main"

      - name: Publish tag
        if: steps.key.outputs.ok == 'true' && github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#php/}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not php/vMAJOR.MINOR.PATCH"; exit 1
          fi
          git push "$MIRROR" "$SPLIT_SHA:refs/tags/$version"
          echo "Published romycode/qsrv-php $version" >> "$GITHUB_STEP_SUMMARY"
