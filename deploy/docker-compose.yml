# Single qsrv with a persistent volume. API keys are tenant:name:key entries:
#   echo "QSRV_API_KEYS=acme:app:$(openssl rand -hex 32)" > .env
#   sudo install -d -o 65532 -g 65532 /var/backups/qsrv   # snapshots dir, writable by the image's nonroot user
#   docker compose -f deploy/docker-compose.yml up -d
services:
  qsrv:
    image: ghcr.io/romycode/qsrv:latest
    restart: unless-stopped
    environment:
      QSRV_API_KEYS: ${QSRV_API_KEYS:?set QSRV_API_KEYS in .env}
      QSRV_LOG_LEVEL: info
      QSRV_BACKUP_DIR: /backup  # hourly snapshots of every tenant, 24 kept
    ports:
      - "8080:8080"
      - "127.0.0.1:9464:9464"   # metrics: no auth, keep them private
    volumes:
      - qsrv-data:/data
      - ${QSRV_BACKUP_PATH:-/var/backups/qsrv}:/backup   # put it on another disk
    stop_grace_period: 30s      # let pending writes commit on SIGTERM

volumes:
  qsrv-data:
