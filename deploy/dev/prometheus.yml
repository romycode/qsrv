# Prometheus for the development stack: scrapes qsrv every 5s and evaluates
# deploy/prometheus/alerts.yml. No Alertmanager: firing alerts show in
# Prometheus (/alerts) and in the qsrv / Alerts dashboard.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: qsrv # the alert rules expect this name
    static_configs:
      - targets: ["qsrv:9464"]
