# Prometheus for the deploy/monitoring stack: scrapes qsrv, evaluates
# deploy/prometheus/alerts.yml and sends alerts to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: qsrv # the alert rules expect this name
    static_configs:
      - targets: ["qsrv:9464"]
